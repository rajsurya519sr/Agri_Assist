{% extends "base.html" %}

{% block title %}{{ code }} - {{ _('AgriAssist') }}{% endblock %}

{% block content %}
<style>
    .error-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 100%);
        color: white;
        text-align: center;
    }
    .error-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 3rem;
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .error-code {
        font-size: 6rem;
        font-weight: 800;
        margin-bottom: 0;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .error-message {
        font-size: 1.5rem;
        margin-bottom: 2rem;
        opacity: 0.9;
    }
    .btn-outline-white {
        border-color: white;
        color: white;
        padding: 0.75rem 2rem;
        font-weight: 600;
        transition: all 0.3s;
    }
    .btn-outline-white:hover {
        background: white;
        color: #1B5E20;
    }
</style>

<div class="error-container">
    <div class="error-card">
        <h1 class="error-code">{{ code }}</h1>
        <p class="error-message">{{ message }}</p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('home') }}" class="btn btn-outline-white">
                <i class="fas fa-home me-2"></i>{{ _('Go Home') }}
            </a>
            <button onclick="history.back()" class="btn btn-outline-white">
                <i class="fas fa-arrow-left me-2"></i>{{ _('Go Back') }}
            </button>
        </div>
    </div>
</div>
{% endblock %}
